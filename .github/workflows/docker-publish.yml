name: 构建并发布 Docker 镜像 (Build & Publish Docker Image)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送到镜像仓库 (Push to registry)'
        required: true
        type: boolean
        default: true

# 授予构建和推送 GitHub Container Registry (ghcr.io) 的权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx (Set up Docker Buildx)
        uses: docker/setup-buildx-action@v3

      - name: 规范化镜像名称为全小写 (Ensure Lowercase Image Name)
        id: image_name
        run: |
          # Docker/GHCR 镜像名称严格要求全小写，防止用户 GitHub 用户名含大写导致推送报错
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: 登录 GitHub Container Registry (Login to ghcr.io)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据与标签 (Extract Docker metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/docker-zh-main' || github.ref == 'refs/heads/docker-zh-dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
            type=sha,format=short

      - name: 构建并推送 Docker 镜像 (Build & Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
